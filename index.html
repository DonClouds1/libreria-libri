<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>La Mia Libreria</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libreria">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header class="topbar">
    <h1 id="topbar-title">Aggiungi libro</h1>
  </header>

  <!-- SCHERMATA: AGGIUNGI / CERCA -->
  <section class="screen" id="screen-aggiungi">
    <form id="search-form" class="search-form">
      <label>
        Titolo <span class="required">*</span>
        <input type="text" id="input-titolo" placeholder="Es. Il nome della rosa" required>
      </label>
      <label>
        Autore
        <input type="text" id="input-autore" placeholder="Es. Umberto Eco">
      </label>
      <label>
        ISBN
        <input type="text" id="input-isbn" placeholder="Es. 9788845292613" inputmode="numeric">
      </label>
      <button type="submit" class="btn btn-primary">Cerca</button>
    </form>

    <div id="search-status" class="search-status"></div>
    <div id="search-results" class="results-list"></div>
  </section>

  <!-- SCHERMATA: DA LEGGERE -->
  <section class="screen hidden" id="screen-daleggere">
    <div class="sort-bar" data-for="daleggere">
      <button class="sort-btn active" data-sort="dataAggiunta">Aggiunta</button>
      <button class="sort-btn" data-sort="nome">Nome</button>
      <button class="sort-btn" data-sort="genere">Genere</button>
      <button class="sort-btn" data-sort="dataUscita">Uscita</button>
    </div>
    <div id="list-daleggere" class="books-list"></div>
    <div id="empty-daleggere" class="empty-state hidden">
      Nessun libro salvato per dopo.<br>Cerca un libro dalla scheda "Aggiungi".
    </div>
  </section>

  <!-- SCHERMATA: LETTI -->
  <section class="screen hidden" id="screen-letti">
    <div class="sort-bar" data-for="letti">
      <button class="sort-btn active" data-sort="dataLettura">Lettura</button>
      <button class="sort-btn" data-sort="nome">Nome</button>
      <button class="sort-btn" data-sort="genere">Genere</button>
      <button class="sort-btn" data-sort="dataUscita">Uscita</button>
      <button class="sort-btn" data-sort="voto">Voto</button>
    </div>
    <div id="list-letti" class="books-list"></div>
    <div id="empty-letti" class="empty-state hidden">
      Nessun libro letto ancora.
    </div>
  </section>

  <!-- SCHERMATA: IMPOSTAZIONI / BACKUP -->
  <section class="screen hidden" id="screen-impostazioni">
    <div class="settings-block">
      <h2>Backup dati</h2>
      <p class="settings-hint">I libri sono salvati solo su questo iPhone. Esporta un backup ogni tanto, soprattutto se non hai installato l'app nella schermata Home.</p>
      <button class="btn btn-secondary" id="btn-export">Esporta backup (JSON)</button>
      <label class="btn btn-secondary" for="input-import" style="display:block; text-align:center;">
        Importa backup
        <input type="file" id="input-import" accept="application/json" style="display:none;">
      </label>
    </div>
    <div class="settings-block">
      <h2>Statistiche</h2>
      <p id="stats-text"></p>
    </div>
    <div class="settings-block danger-block">
      <h2>Zona pericolosa</h2>
      <button class="btn btn-danger" id="btn-reset">Cancella tutti i dati</button>
    </div>
  </section>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="aggiungi">
      <span class="nav-icon">➕</span><span>Aggiungi</span>
    </button>
    <button class="nav-btn" data-screen="daleggere">
      <span class="nav-icon">📚</span><span>Da leggere</span>
    </button>
    <button class="nav-btn" data-screen="letti">
      <span class="nav-icon">✅</span><span>Letti</span>
    </button>
    <button class="nav-btn" data-screen="impostazioni">
      <span class="nav-icon">⚙️</span><span>Altro</span>
    </button>
  </nav>

</div>

<!-- MODALE DETTAGLIO LIBRO -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
